<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Showcase</title>
</head>
<body>
    <header>
        <h1>Photo Showcase </h1>
        <p> A small collection of nature and travels-inspired images.</p>
    </header>

    <main>
        <section>
            <h2> Image Gallery</h2>

            <figure>
                <img 
                src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" 
                alt="A long road" 
                width="600" 
                height="400"
                >
                <figcaption> A long and quiet road leading to a mountain range.</figcaption>
            </figure>

            <figure>
                <img 
                src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" 
                alt="A serene lake" 
                width="600" 
                height="400"
                >
                <figcaption> A serene bright blue lake with boats and mountains in the background.</figcaption>
            </figure>

            <figure>
                <img 
                src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e" 
                alt="A bright blue lake surrounded by mountains" 
                width="600" 
                height="400"
                >
                <figcaption> A family lodge surrounded by mountains in the background.</figcaption>
            </figure>

            <figure>
                <img
                src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e" 
                alt="A beautiful sunset over the ocean" 
                width="600" 
                height="400"
            >

            <img
                src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" 
                alt="A sandy beach with clear blue water" 
                width="600" 
                height="400"
            >
            <img
                src="https://images.unsplash.com/photo-1519681393784-d120267933ba" 
                alt="A mountain landscape with a clear blue sky" 
                width="600" 
                height="400"
            >
            </figure>
        </section>

        <section>
            <h2> Featured Video </h2>

            <video
                controls
                width="600"
                height="400"
                poster="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
            >
                <source src="media/showcase-video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Photo Showcase. All rights reserved.</p>
    </footer>
    
</body>
</html>
